name: Publish container image

on:
  workflow_dispatch:
    inputs:
      graalvm_version:
        description: "GraalVM CE release/tag version override (leave empty to use graalvm.env)"
        required: false
        default: ""
      graalvm_jdk_version:
        description: "GraalVM CE JDK/filename version override (leave empty to use graalvm.env)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lofthouse-dev/graalvm-pi-builder

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          INPUT_GRAALVM_VERSION: ${{ github.event.inputs.graalvm_version }}
          INPUT_GRAALVM_JDK_VERSION: ${{ github.event.inputs.graalvm_jdk_version }}
        run: |
          set -euo pipefail
          # graalvm.env is the single source of truth; an explicit workflow input
          # overrides it.
          . ./graalvm.env
          GRAALVM_VERSION="${INPUT_GRAALVM_VERSION:-${GRAALVM_VERSION:-}}"
          GRAALVM_JDK_VERSION="${INPUT_GRAALVM_JDK_VERSION:-${GRAALVM_JDK_VERSION:-}}"
          if [ -z "$GRAALVM_VERSION" ] || [ -z "$GRAALVM_JDK_VERSION" ]; then
            echo "::error::Could not determine GraalVM versions (version='${GRAALVM_VERSION}', jdk='${GRAALVM_JDK_VERSION}')"
            exit 1
          fi
          echo "Building GraalVM ${GRAALVM_VERSION} (JDK ${GRAALVM_JDK_VERSION})"
          MAJOR=$(echo "$GRAALVM_VERSION" | cut -d. -f1)
          DATE=$(date -u +%Y%m%d)
          IMAGE="${{ env.IMAGE }}"
          echo "graalvm_version=${GRAALVM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "graalvm_jdk_version=${GRAALVM_JDK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:bookworm-graal${MAJOR},${IMAGE}:bookworm-${GRAALVM_VERSION},${IMAGE}:bookworm-${GRAALVM_VERSION}-${DATE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GRAALVM_VERSION=${{ steps.tags.outputs.graalvm_version }}
            GRAALVM_JDK_VERSION=${{ steps.tags.outputs.graalvm_jdk_version }}
